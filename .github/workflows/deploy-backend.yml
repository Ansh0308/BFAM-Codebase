name: Deploy backend

# Builds the backend Docker image, pushes it to GitHub Container Registry, and —
# only when you have switched deployment on — updates the VM over SSH.
#
# One-time setup (BFAM_Deployment_Plan.md, "Azure runbook"):
#   Repository variable  DEPLOY_ENABLED = true         (leave unset to only build the image)
#   Repository secrets   DEPLOY_HOST        VM address (the <name>.<region>.cloudapp.azure.com host)
#                        DEPLOY_USER        SSH user on the VM
#                        DEPLOY_SSH_KEY     private key whose public half is in the VM's authorized_keys
#                        DEPLOY_KNOWN_HOSTS output of:  ssh-keyscan -t ed25519 <DEPLOY_HOST>
#   Optional variable    DEPLOY_PATH        folder on the VM (default /opt/bfam)

on:
  push:
    branches: [main]
    paths:
      - 'apps/backend/**'
      - 'packages/**'
      - 'package.json'
      - 'package-lock.json'
      - 'deploy/**'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

concurrency:
  group: deploy-backend
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  image:
    name: Build & push image
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.name.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      # Registry names must be lowercase; GitHub owners may not be.
      - name: Work out the image name
        id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/bfam-backend" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The build runs `tsc`, so a type error stops the deploy here.
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/backend/Dockerfile
          push: true
          tags: |
            ${{ steps.name.outputs.image }}:latest
            ${{ steps.name.outputs.image }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Update the VM
    needs: image
    if: ${{ vars.DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/opt/bfam' }}
      IMAGE: ${{ needs.image.outputs.image }}:${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      # Secrets go through the environment, never pasted into the script text.
      - name: Prepare SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Copy the compose files
        run: |
          scp -i ~/.ssh/deploy_key \
            deploy/docker-compose.azure.yml deploy/Caddyfile \
            "${DEPLOY_USER}@${DEPLOY_HOST}:${DEPLOY_PATH}/"

      # The registry token only lives for this run, so log in on the VM each
      # time; it travels over SSH stdin, never on a command line.
      - name: Pull the new image and restart
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REGISTRY_USER: ${{ github.actor }}
        run: |
          printf '%s' "$REGISTRY_TOKEN" | ssh -i ~/.ssh/deploy_key "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "docker login ghcr.io -u '${REGISTRY_USER}' --password-stdin"
          # BACKEND_IMAGE is recorded in the VM's .env so a manual
          # `docker compose up -d` later starts the same version.
          ssh -i ~/.ssh/deploy_key "${DEPLOY_USER}@${DEPLOY_HOST}" bash -s <<REMOTE
          set -euo pipefail
          cd '${DEPLOY_PATH}'
          touch .env
          grep -v '^BACKEND_IMAGE=' .env > .env.next || true
          echo 'BACKEND_IMAGE=${IMAGE}' >> .env.next
          mv .env.next .env
          docker compose -f docker-compose.azure.yml pull backend
          docker compose -f docker-compose.azure.yml up -d --remove-orphans
          docker image prune -f
          REMOTE

      # The backend applies database migrations at start-up, so a healthy
      # answer means the new version is up and the schema is current.
      - name: Check the deployment is healthy
        run: |
          for i in $(seq 1 20); do
            if curl -fsS "https://${DEPLOY_HOST}/health"; then echo; exit 0; fi
            echo "waiting for the backend (attempt $i)…"; sleep 6
          done
          echo "The backend did not become healthy in time." >&2
          exit 1
