name: Build admin portal image

# Builds the admin portal (apps/web) into a Docker image and pushes it to GitHub
# Container Registry as bfam-web. The VM then pulls it (see deploy/docker-compose.azure.yml,
# service "web", started with --profile portal). Unlike the backend workflow this only
# builds the image; the update on the VM is done by hand.

on:
  push:
    branches: [main]
    paths:
      - 'apps/web/**'
      - 'packages/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/build-web.yml'
  workflow_dispatch:

concurrency:
  group: build-web
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  image:
    name: Build & push image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Registry names must be lowercase; GitHub owners may not be.
      - name: Work out the image name
        id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/bfam-web" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The build runs `next build`, which type-checks and lints, so an error stops it here.
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: |
            ${{ steps.name.outputs.image }}:latest
            ${{ steps.name.outputs.image }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # When the image build fails, repeat it with plain output and show the end of that
      # output as an error annotation: Docker's own log is not readable without signing in
      # to GitHub.
      - name: Show why the build failed
        if: failure()
        run: |
          set +e
          docker build --progress=plain -f apps/web/Dockerfile -t bfam-web-debug . > /tmp/docker.log 2>&1
          code=$?
          {
            echo "docker build exit ${code}"
            echo '--- last lines:'
            tail -n 45 /tmp/docker.log
          } > /tmp/why.log
          msg=$(sed -e 's/%/%25/g' /tmp/why.log | sed ':a;N;$!ba;s/\r//g;s/\n/%0A/g')
          echo "::error title=Docker build output::${msg}"
